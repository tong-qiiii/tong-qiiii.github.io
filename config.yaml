baseurl: "https://tong-qiiii.github.io/"
languageCode: zh-cn
defaultContentLanguage: zh-cn
hasCJKLanguage: true
theme: hugo-theme-stack
title: "tongqi · 学习记录"
copyright: tongqi
enableRobotsTXT: true
pagination:
  pagerSize: 6
permalinks:
  post: /p/:slug/
  solutions: /solutions/:slug/
  notes: /notes/:slug/
  page: /:slug/
params:
  description: "记录 ICPC 题解、算法思考与个人学习笔记。"
  mainSections: [solutions, notes, post]
  featuredImageField: image
  rssFullContent: true
  favicon: /favicon.svg
  footer:
    since: 2025
    customText: "记录思考，慢慢积累。"
  dateFormat:
    published: "2006-01-02"
    lastUpdated: "2006-01-02"
  sidebar:
    subtitle: "ICPC 题解 / 学习笔记 / 资料收藏"
    avatar:
      enabled: false
  article:
    math: true
    toc: true
    readingTime: true
    headingAnchor: true
    license:
      enabled: false
  comments:
    enabled: false
  widgets:
    homepage:
      - type: search
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 15
    page:
      - type: toc
  colorScheme:
    toggle: true
    default: auto
  imageProcessing:
    cover:
      enabled: true
    content:
      enabled: true
menu:
  social:
    - identifier: github
      name: tongqi 的 GitHub
      url: https://github.com/tong-qiiii
      params:
        icon: brand-github
    - identifier: rss
      name: RSS 订阅
      url: /index.xml
      params:
        icon: rss
related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 200
markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["\\[", "\\]"], ["$$", "$$"]]
          inline: [["\\(", "\\)"], ["$", "$"]]
    renderer:
      unsafe: false
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: false
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
